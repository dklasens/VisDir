name: CI

on:
  push:
  pull_request:

# Least privilege: CI only reads the repo and writes nothing (test-result artifacts
# ride on the default per-job token scope for actions/upload-artifact).
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
      - run: dotnet restore VisDir.sln
      - run: dotnet build VisDir.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
      - run: dotnet test VisDir.sln -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: dotnet run --project src/VisDir.App -c Release --no-build -- --worker tests --mode generic --top 0
      - run: dotnet run --project benchmarks/VisDir.Benchmarks -c Release --no-build -- --nodes 100000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"
