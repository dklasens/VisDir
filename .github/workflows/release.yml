name: Release

# NOTE: tag protection — configure a tag protection rule for `v*` in the repository
# settings so only maintainers can push release tags that trigger this workflow.
# All third-party actions are pinned to full commit SHAs (comments name the moving tag).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-prefixed release tag (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VisDir.sln

      - name: Validate release tag and project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (dotnet msbuild src/VisDir.App/VisDir.App.csproj -getProperty:Version -nologo).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match project version v$version"
          }

      - name: Run Tests
        run: dotnet test VisDir.sln -c Release --no-restore

      - name: Build & Package win-x64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-x64 -Configuration Release

      - name: Build & Package win-arm64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-arm64 -Configuration Release

      - name: Install WiX v6
        run: dotnet tool install --global wix --version 6.*

      - name: Build x64 MSI
        shell: pwsh
        run: ./installer/build.ps1 -SkipPublish

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-files -Force | Out-Null
          Copy-Item artifacts/publish/VisDir-win-x64.zip release-files/
          Copy-Item artifacts/publish/VisDir-win-arm64.zip release-files/
          Copy-Item artifacts/publish/win-x64/checksums-win-x64.sha256 release-files/
          Copy-Item artifacts/publish/win-arm64/checksums-win-arm64.sha256 release-files/
          Copy-Item artifacts/installer/*.msi release-files/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  publish:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write # only this job can create the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-files/VisDir-win-x64.zip
            release-files/VisDir-win-arm64.zip
            release-files/checksums-win-x64.sha256
            release-files/checksums-win-arm64.sha256
            release-files/*.msi
