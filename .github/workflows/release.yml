name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v-prefixed release tag (for example v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VisDir.sln

      - name: Validate release tag and project version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (dotnet msbuild src/VisDir.App/VisDir.App.csproj -getProperty:Version -nologo).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match project version v$version"
          }

      - name: Run Tests
        run: dotnet test VisDir.sln -c Release --no-restore

      - name: Build & Package win-x64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-x64 -Configuration Release

      - name: Build & Package win-arm64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-arm64 -Configuration Release

      - name: Install WiX v6
        run: dotnet tool install --global wix --version 6.*

      - name: Build x64 MSI
        shell: pwsh
        run: ./installer/build.ps1 -SkipPublish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/publish/VisDir-win-x64.zip
            artifacts/publish/VisDir-win-arm64.zip
            artifacts/publish/win-x64/checksums-win-x64.sha256
            artifacts/publish/win-arm64/checksums-win-arm64.sha256
            artifacts/installer/*.msi
