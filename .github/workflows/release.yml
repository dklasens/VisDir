name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VisDir.sln

      - name: Run Tests
        run: dotnet test VisDir.sln -c Release --no-restore

      - name: Build & Package win-x64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-x64 -Configuration Release

      - name: Build & Package win-arm64
        shell: pwsh
        run: |
          ./scripts/publish.ps1 -Runtime win-arm64 -Configuration Release

      - name: Generate Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $notes = @"
          ## VisDir v1.0 Release

          A fast, modern disk space visualizer and analyzer for Windows, inspired by DaisyDisk.

          ### Highlights
          - **Interactive GPU Sunburst**: Fluid SkiaSharp multi-ring chart with harmonic pastel palettes.
          - **WizTree-class NTFS MFT Engine**: Sub-second full-drive indexing via sequential Master File Table streaming.
          - **Multi-Threaded Compatible Engine**: Batch folder scanning supporting subfolders, USB drives (FAT32/exFAT), and network UNC paths.
          - **Full Context Menu**: Right-click wedges or list items to reveal in Explorer or copy paths.
          - **Live Filtering & Capacity Gauges**: Search folders and explore proportional size bars in real time.
          - **Zero Telemetry**: Fully offline, private, and lightweight.

          ### Installation
          Download and extract **``VisDir-win-x64.zip``** and launch **``VisDir.App.exe``**.
          "@
          Set-Content -Path "RELEASE_NOTES.md" -Value $notes -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            artifacts/publish/VisDir-win-x64.zip
            artifacts/publish/VisDir-win-arm64.zip
            artifacts/publish/win-x64/checksums.sha256
            artifacts/publish/win-arm64/checksums.sha256
